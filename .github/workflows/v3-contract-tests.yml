name: V3 Mobile Contract Tests
on:
  pull_request:
    paths:
      - 'v3/contracts/**'
      - '.github/workflows/v3-contract-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contract tests (fixtures only, no backend, no secrets)
        working-directory: v3/contracts/duo-backend/v3
        run: node --test mockBackend.test.ts envelopeRead.test.ts sqlFixtures.test.ts errors.test.ts hardening.test.ts cache.r2-02.test.ts
