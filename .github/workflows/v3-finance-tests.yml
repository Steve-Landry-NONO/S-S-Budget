name: V3 Finance Tests
on:
  pull_request:
    paths:
      - 'v3/core/**'
      - '.github/workflows/v3-finance-tests.yml'
  push:
    branches:
      - 'test/v3-finance-edge-cases'
    paths:
      - 'v3/core/**'
      - '.github/workflows/v3-finance-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run financial core tests
        run: node --test v3/core/*.test.js
